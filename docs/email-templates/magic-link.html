<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="supported-color-schemes" content="dark light">
<title>Seu código radioOn</title>
</head>
<body style="margin:0;padding:0;background:#00112A;" bgcolor="#00112A">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#00112A" style="background:#00112A;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;font-family:Arial,Helvetica,sans-serif;color:#FFFFFF;">
        <tr>
          <td style="padding:0 0 4px;">
            <img src="https://radioon-ten.vercel.app/brand/logo.png" width="120" height="84" alt="radioOn" style="display:block;border:0;width:120px;height:auto;">
          </td>
        </tr>
        <tr><td style="padding:0 0 24px;color:#E89A3C;font-size:15px;">Música para os melhores ouvintes.</td></tr>
        <tr><td style="padding:0 0 8px;font-size:20px;font-weight:700;color:#FFFFFF;">Entrar na radioOn</td></tr>
        <tr><td style="padding:0 0 20px;font-size:16px;line-height:1.5;color:#FFFFFF;">Use este código para entrar. Sem senha.</td></tr>
        <tr>
          <td align="center" bgcolor="#0B2347" style="background:#0B2347;border:2px solid #E89A3C;border-radius:12px;padding:20px 12px;">
            <span style="font-family:'Courier New',Courier,monospace;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:10px;color:#E89A3C;">{{ .Token }}</span>
          </td>
        </tr>
        <tr><td style="padding:16px 0 4px;font-size:15px;color:#FFFFFF;">Vale por 10 minutos.</td></tr>
        <tr><td style="padding:0 0 28px;font-size:14px;line-height:1.5;color:#C9D3E3;">Se não foi você, ignore este e-mail.</td></tr>
        <tr><td style="border-top:1px solid #23395E;padding:16px 0 0;font-size:13px;color:#C9D3E3;">radioOn · Música para os melhores ouvintes.</td></tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
