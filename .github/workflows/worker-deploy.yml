# Arquivo protegido. Deploy do Worker de áudio (plano gratuito do Cloudflare). Imprime a URL *.workers.dev.
name: worker-deploy
on:
  push:
    branches: [main]
    paths: ["workers/audio-proxy/**"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao-db   # B2_READ_KEY*/S3_*/CF_* ficam neste ambiente (só branch main)
    defaults: { run: { working-directory: workers/audio-proxy } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - name: Namespace KV (cria se não existir)
        run: |
          ID=$(npx wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s).find(x=>x.title==="radioon-audio-cache");console.log(n?n.id:"")})')
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create radioon-audio-cache >/dev/null
            ID=$(npx wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).find(x=>x.title==="radioon-audio-cache").id)})')
          fi
          cp wrangler.toml wrangler.generated.toml
          printf '\n[[kv_namespaces]]\nbinding = "CACHE"\nid = "%s"\n' "$ID" >> wrangler.generated.toml
      - name: Subdomínio workers.dev (registra via API se a conta ainda não tiver)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          atual=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$atual" ]; then
            for nome in radioon radioon-app radioon-music radioon-$RANDOM; do
              if curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
                   --data "{\"subdomain\":\"$nome\"}" "$api" >/dev/null 2>&1; then atual="$nome"; break; fi
            done
          fi
          [ -n "$atual" ] || { echo "::error::Não foi possível registrar o subdomínio workers.dev (token sem permissão Workers Scripts: Edit?)"; exit 1; }
          echo "Subdomínio workers.dev: $atual"
      - name: Deploy
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.generated.toml 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::Deploy sem URL workers.dev"; exit 1; }
          echo "URL do Worker (NEXT_PUBLIC_AUDIO_BASE_URL): $url"
          echo "URL do Worker (NEXT_PUBLIC_AUDIO_BASE_URL): \`$url\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Secrets do Worker (chave B2 SOMENTE LEITURA; valores nunca aparecem no log)
        env:
          B2_READ_KEY_ID: ${{ secrets.B2_READ_KEY_ID }}
          B2_READ_KEY: ${{ secrets.B2_READ_KEY }}
          B2_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          B2_REGION: ${{ secrets.S3_REGION }}
          B2_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          for n in B2_READ_KEY_ID B2_READ_KEY B2_ENDPOINT B2_REGION B2_BUCKET; do
            printf '%s' "${!n}" | npx wrangler secret put "$n" --config wrangler.generated.toml >/dev/null
          done
