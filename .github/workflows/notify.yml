name: notify

# Cria/atualiza issues de alerta do Claude Code como github-actions[bot].
# Disparado por scripts/notify.sh via "gh workflow run notify.yml".

on:
  workflow_dispatch:
    inputs:
      title:
        description: Título da issue
        required: true
        type: string
      body:
        description: Corpo da issue (markdown)
        required: true
        type: string
      label:
        description: Label (acao-necessaria | relatorio)
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Criar issue ou comentar na existente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          LABEL: ${{ inputs.label }}
          MENTION: "@juliobalsini"
        run: |
          set -euo pipefail

          case "$LABEL" in
            acao-necessaria) color="d93f0b"; desc="Claude Code precisa de ação humana" ;;
            relatorio)       color="0e8a16"; desc="Relatório do Claude Code" ;;
            *)               color="ededed"; desc="Alerta do Claude Code" ;;
          esac
          gh label create "$LABEL" --color "$color" --description "$desc" 2>/dev/null || true

          full_body="$(printf '%s\n\n%s' "$MENTION" "$BODY")"

          # "Ação necessária": no máximo uma issue aberta por dia (mesmo título).
          existing=""
          if [ "$LABEL" = "acao-necessaria" ]; then
            existing="$(gh issue list --state open --label "$LABEL" --limit 50 \
              --json number,title \
              --jq "map(select(.title == env.TITLE)) | first | .number // empty")"
          fi

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$full_body"
            echo "Comentário adicionado na issue #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            url="$(gh issue create --title "$TITLE" --label "$LABEL" --body "$full_body")"
            echo "Issue criada: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
